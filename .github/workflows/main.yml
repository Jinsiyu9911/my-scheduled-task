name: Long Loop Auto Restart

on:
  schedule:
    # 兜底机制：每天触发一次，防止某次网络问题导致接力失败彻底断掉
    - cron: '0 0 * * *' 
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: long-loop-task
  cancel-in-progress: false

jobs:
  run-loop:
    runs-on: ubuntu-latest
    # 这里设置 360 分钟（6小时）。因为 Python 会在 5小时45分主动退出，
    # 这个 timeout 只是用来防止 Python 代码卡死时，被平台强制杀掉。
    timeout-minutes: 360 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run main.py
        # -u 参数强制实时输出日志，方便你在网页上随时查看进度
        run: python -u .github/workflows/main.py

      - name: Trigger Next Workflow (Restart)
        # 关键修改：只有前面正常结束（主动 exit(0)），才执行接力
        if: success() 
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "上一轮任务已圆满结束，正在触发下一轮..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d '{"ref":"main"}'
