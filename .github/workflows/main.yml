name: Infinite Loop Auto Restart

on:
  schedule:
    # 兜底：每天 UTC 0点 触发一次
    - cron: '0 0 * * *' 
  workflow_dispatch:

permissions:
  actions: write

# 并发控制：确保同一时间只有一个该工作流在运行
concurrency:
  group: infinite-task
  cancel-in-progress: false

jobs:
  run-loop:
    runs-on: ubuntu-latest
    # 关键：5小时50分（350分钟）强制超时。留10分钟给后续的重启步骤执行。
    timeout-minutes: 350 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run infinite loop
        run: python main.py
        # 这一步跑满 350 分钟后，会被 GitHub 强行杀掉，状态变为 Failure

      - name: Trigger Next Workflow (Restart)
        # 关键：无论前一步是成功还是超时失败，都强制执行！
        if: always() 
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "上一轮任务已终止，正在触发下一轮..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d '{"ref":"main"}'
