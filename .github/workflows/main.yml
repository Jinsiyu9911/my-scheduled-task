name: 电表监控长循环

# ── 触发方式 ───────────────────────────────────────────────────────────────
# 1) schedule：每天 00:00 UTC 兜底触发一次，万一接力链断了也能自己爬起来；
# 2) workflow_dispatch：手动触发 + 上一轮 job 结束后的「接力」。
#    注意：本 workflow 自己 dispatch 自己不会触发——GitHub 规定
#          「由 GITHUB_TOKEN 产生的 workflow_run/dispatch，不会再运行新的 workflow」，
#    所以接力必须用一个 PAT（secrets.PAT_TOKEN）。
#    手动跑时可以填 max_run（秒）做短跑验证，比如 180 秒就能看到完整链路。
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      max_run:
        description: '本次运行秒数（测试用，留空=20700 即 5h45m）'
        required: false
        default: ''

# 提交 data/ 需要写权限；actions: write 用于接力 dispatch
permissions:
  contents: write
  actions: write

concurrency:
  group: meter-monitor-long-loop
  cancel-in-progress: false

env:
  # runner 默认 UTC。设成北京时间，CSV 时间戳、每日 22:00 汇总、图表坐标轴才符合预期。
  TZ: Asia/Shanghai
  DATA_DIR: .github/workflows/data

jobs:
  run-loop:
    runs-on: ubuntu-latest
    # 平台单 job 硬上限 6 小时。main.py 会在 5h45m 主动 exit(0) 交棒，
    # 这里的 timeout 只是防止 Python 卡死时被平台强杀。
    timeout-minutes: 350

    steps:
      - name: Checkout（保留完整历史，便于 rebase 推送）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true      # main.py 内部的自动提交要用这份凭证推送

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备 data 目录
        # 全新克隆里没有 data/，先建出来，避免 git add 报 pathspec 错
        run: mkdir -p "$DATA_DIR"

      - name: Run main.py
        # -u：强制实时输出，方便在网页上随时看进度。
        # main.py 每 30 分钟会把 data/ 里的小文件（CSV/JSON）提交并推回仓库，
        # 所以跑起来后半小时内就能在仓库里看到文件，不用等 5h45m 结束。
        # 图表（BMP 较大）不频繁提交，改为随 artifact 一起打包（见后面的步骤）。
        env:
          MAX_RUN: ${{ github.event.inputs.max_run }}
        run: |
          ARGS=""
          if [ -n "${MAX_RUN}" ]; then ARGS="--max-run ${MAX_RUN}"; fi
          echo "启动参数: ${ARGS:-（默认 5h45m）}"
          python -u .github/workflows/main.py ${ARGS}

      - name: Commit data（兜底提交，有变化才提交）
        # main.py 已定期提交过小文件；这里补上它没管的（以及停跑瞬间的最后状态），
        # 同时确保本次运行一定落盘一次。charts/ 与日志不提交（体积大），走 artifact。
        if: success()
        run: |
          set -e
          git config user.name  "meter-monitor-bot"
          git config user.email "meter-monitor-bot@users.noreply.github.com"

          # BMP 不提交（每张约 938KB），PNG 由 main.py 转换后才提交（约 6KB）
          git add -A -- "$DATA_DIR" ':(exclude)'"$DATA_DIR/charts/*.bmp" ':(exclude)'"$DATA_DIR/monitor.log" ':(exclude)'"$DATA_DIR/alerts.log"
          if git diff --cached --quiet; then
            echo "data/ 无变化，跳过提交"
          else
            git commit -m "data: $(date '+%Y-%m-%d %H:%M %Z') 电表数据"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push 第 $i 次失败，2 秒后重试"; sleep 2
            done
          fi

      - name: Upload charts（本次运行的图表与日志）
        # 图表每张约 1MB，提交进 git 会让历史迅速膨胀，所以打包成 artifact 供下载；
        # 保留 14 天，与 monitor.py 的 RETENTION_DAYS 对齐。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meter-charts-${{ github.run_number }}
          path: |
            .github/workflows/data/charts/*.bmp
            .github/workflows/data/monitor.log
            .github/workflows/data/alerts.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Trigger Next Workflow (Restart)
        # 关键：只有前面步骤都成功（Python 主动 exit(0)）才接力，保持原语义
        if: success()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "${PAT_TOKEN}" ]; then
            echo "::error::缺少 secrets.PAT_TOKEN，接力失败（PAT 需要 actions:write + contents:write）"
            exit 1
          fi
          echo "上一轮任务已圆满结束，正在触发下一轮..."
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/main.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"

      - name: Summary（数据与文件直达链接）
        if: always()
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${DATA_DIR}"
          TREE="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/${DATA_DIR}"
          {
            echo "### 电表监控本轮摘要"
            echo ""
            echo "- 当前时间：$(date '+%Y-%m-%d %H:%M:%S %Z')"
            if [ -f "$DATA_DIR/meter_data.csv" ]; then
              echo "- CSV 行数：$(($(wc -l < "$DATA_DIR/meter_data.csv") - 1))"
            fi
            echo "- 图表数：$(ls "$DATA_DIR/charts" 2>/dev/null | wc -l)（本轮的已打包到下方 Artifacts）"
            echo ""
            if [ -f "$DATA_DIR/latest.json" ]; then
              echo '```json'
              cat "$DATA_DIR/latest.json"
              echo '```'
            fi
            echo ""
            echo "**文件直达**（页面刷新即可看到最新提交）"
            echo ""
            echo "- [meter_data.csv](${BASE}/meter_data.csv)"
            echo "- [latest.json](${BASE}/latest.json)"
            echo "- [alert_state.json](${BASE}/alert_state.json)"
            echo "- [数据目录](${TREE})"
            echo ""
            echo "> 图表与日志体积较大，未提交到仓库；在本次运行的 **Artifacts → meter-charts-* ** 里下载（保留 14 天）。"
          } >> "$GITHUB_STEP_SUMMARY"
